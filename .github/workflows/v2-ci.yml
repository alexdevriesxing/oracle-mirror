name: Oracle Mirror V2 CI

# Runs on demand only.
#
# GitHub Actions minutes on this account are exhausted every month, and while
# they are, every triggered run fails in about four seconds with steps: []
# having done nothing. Deployment does not depend on Actions - Cloudflare builds
# each push from Git - so automatic triggers here only consumed the budget and
# painted healthy commits red.
#
# Run this from the Actions tab (Run workflow) when you actually want it, or
# locally with the commands it wraps. Do not re-add a push trigger unless the
# minutes budget is raised enough to carry it.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
