name: Pass 16 share sanitizer patch

on:
  push:
    branches:
      - v2/pass-16-advanced-iching

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/pass-16-advanced-iching
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add dedicated I Ching share payload
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('public/share-card-core.js')
          text = path.read_text()
          if '"iching",' not in text:
              text = text.replace('  "lenormand",\n]);', '  "lenormand",\n  "iching",\n]);')
          marker = '  const score = cleanNumber(input.score, 0, 100);'
          block = '''  if (kind === "iching") {
            const current = cleanText(input.current, 88);
            const transformed = cleanText(input.transformed, 88);
            const changingLines = Array.isArray(input.changingLines)
              ? [...new Set(input.changingLines.map(Number).filter((value) => Number.isInteger(value) && value >= 1 && value <= 6))].slice(0, 6)
              : [];
            if (!current) return null;
            return {
              version: SHARE_CARD_VERSION,
              kind,
              eyebrow: "I CHING CAST",
              title: current,
              glyph: cleanText(input.currentSymbol, 8) || "☯",
              subtitle: transformed ? "Changing lines reveal a transformed hexagram" : "A stable six-line cast",
              lines: [
                transformed ? `Transforms to ${transformed}` : "No changing lines appeared",
                changingLines.length ? `Changing lines: ${changingLines.join(", ")}` : "Six stable lines",
              ],
              footer: "Generated hexagrams only — no private question is collected or shared",
            };
          }

'''
          if 'kind === "iching"' not in text:
              if marker not in text:
                  raise SystemExit('share sanitizer marker missing')
              text = text.replace(marker, block + marker)
          path.write_text(text)
          PY
      - name: Verify shared sanitizer and build
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          grep -q 'kind === "iching"' public/share-card-core.js
      - name: Commit clean source result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pass16-share-patch.yml
          git add public/share-card-core.js
          git commit -m "feat: add privacy-safe I Ching share payload"
          git push origin HEAD:v2/pass-16-advanced-iching
