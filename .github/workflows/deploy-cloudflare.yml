name: Deploy Oracle Mirror to Cloudflare

on:
  workflow_run:
    workflows:
      - Oracle Mirror V2 CI
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: oracle-mirror-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Resolve deployment commit
        id: revision
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production Worker
        env:
          GITHUB_SHA: ${{ steps.revision.outputs.sha }}
        run: npm run build

      - name: Validate Cloudflare deployment credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Deployment failed: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets must be configured."
            exit 1
          fi
          echo "Cloudflare deployment credentials configured."

      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy

      - name: Verify production
        shell: bash
        run: |
          target_sha="${{ steps.revision.outputs.sha }}"
          verify() {
            homepage="$(curl --fail --silent --show-error https://oraclemirror.com/)" || return 1
            headers="$(curl --fail --silent --show-error --head https://oraclemirror.com/)" || return 1
            removed_status="$(curl --silent --output /dev/null --write-out '%{http_code}' https://oraclemirror.com/oracle-of-olympus)"
            runes_status="$(curl --silent --output /dev/null --write-out '%{http_code}' https://oraclemirror.com/runes)"
            version_res="$(curl --fail --silent --show-error https://oraclemirror.com/api/version)" || return 1

            grep -q '<title>Free Tarot, Horoscopes & Mystical Readings | Oracle Mirror</title>' <<< "$homepage" || return 1
            ! grep -qi 'World Cup 2026' <<< "$homepage" || return 1
            grep -qi '^x-content-type-options: nosniff' <<< "$headers" || return 1
            grep -qi '^referrer-policy: strict-origin-when-cross-origin' <<< "$headers" || return 1
            [[ "$removed_status" == "410" ]] || return 1
            [[ "$runes_status" == "200" ]] || return 1
            grep -q "$target_sha" <<< "$version_res" || return 1
          }

          echo "Awaiting production convergence for commit $target_sha..."
          for attempt in {1..24}; do
            if verify; then
              echo "Production verification passed for $target_sha"
              exit 0
            fi
            sleep 5
          done

          echo "Production verification did not converge to the verified commit $target_sha."
          exit 1

