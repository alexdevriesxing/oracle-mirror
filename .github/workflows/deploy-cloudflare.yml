name: Deploy Oracle Mirror to Cloudflare

on:
  workflow_run:
    workflows:
      - Oracle Mirror V2 CI
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: oracle-mirror-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Resolve deployment commit
        id: revision
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production Worker
        run: npm run build

      - name: Check Cloudflare deployment credentials
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deployment skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets."
          fi

      - name: Deploy Worker
        if: steps.cloudflare.outputs.configured == 'true'
        run: npx --yes wrangler@4 deploy

      - name: Verify production
        if: steps.cloudflare.outputs.configured == 'true'
        shell: bash
        run: |
          verify() {
            homepage="$(curl --fail --silent --show-error https://oraclemirror.com/)" || return 1
            headers="$(curl --fail --silent --show-error --head https://oraclemirror.com/)" || return 1
            removed_status="$(curl --silent --output /dev/null --write-out '%{http_code}' https://oraclemirror.com/oracle-of-olympus)"

            grep -q '<title>Free Tarot, Horoscopes & Mystical Readings | Oracle Mirror</title>' <<< "$homepage" || return 1
            ! grep -qi 'World Cup 2026' <<< "$homepage" || return 1
            grep -qi '^x-content-type-options: nosniff' <<< "$headers" || return 1
            grep -qi '^referrer-policy: strict-origin-when-cross-origin' <<< "$headers" || return 1
            [[ "$removed_status" == "410" ]] || return 1
          }

          for attempt in {1..12}; do
            if verify; then
              echo "Production verification passed for ${{ steps.revision.outputs.sha }}"
              exit 0
            fi
            sleep 5
          done

          echo "Production verification did not converge to the verified commit."
          exit 1
