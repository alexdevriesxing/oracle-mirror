name: Deploy Oracle Mirror to Cloudflare (manual fallback)

# MANUAL FALLBACK ONLY - this workflow no longer runs automatically.
#
# Production deploys are handled by Cloudflare Workers Builds, which builds and
# deploys every push to master by itself and needs neither GitHub Actions
# minutes nor a Cloudflare API token. See DEPLOYMENT.md for the dashboard
# settings (Workers & Pages -> oracle-mirror -> Settings -> Build -> Connect to
# Git; build `npm run build`, deploy `npx wrangler deploy`, branch master).
#
# This file previously triggered on workflow_run after CI and was the only way
# the repository deployed. It could never honour that: the account Actions
# spending limit is exhausted, so runs end in ~4s with steps: [] and the
# annotation "The job was not started because an Actions budget is preventing
# further use". That is a billing setting at
# https://github.com/settings/billing, not a configuration problem.
#
# To ship by hand from a clean checkout of master instead:
#
#   npm ci && npm run build && npx wrangler deploy

on:
  workflow_dispatch:

concurrency:
  group: oracle-mirror-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production Worker
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run build

      - name: Validate Cloudflare deployment credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Deployment failed: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets must be configured."
            exit 1
          fi
          echo "Cloudflare deployment credentials configured."

      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy

      - name: Verify production
        shell: bash
        run: |
          target_sha="${{ github.sha }}"
          verify() {
            homepage="$(curl --fail --silent --show-error https://oraclemirror.com/)" || return 1
            headers="$(curl --fail --silent --show-error --head https://oraclemirror.com/)" || return 1
            removed_status="$(curl --silent --output /dev/null --write-out '%{http_code}' https://oraclemirror.com/oracle-of-olympus)"
            runes_status="$(curl --silent --output /dev/null --write-out '%{http_code}' https://oraclemirror.com/runes)"
            version_res="$(curl --fail --silent --show-error https://oraclemirror.com/api/version)" || return 1

            grep -q '<title>Free Tarot, Horoscopes &amp; Mystical Readings | Oracle Mirror</title>' <<< "$homepage" || return 1
            ! grep -qi 'World Cup 2026' <<< "$homepage" || return 1
            grep -qi '^x-content-type-options: nosniff' <<< "$headers" || return 1
            grep -qi '^referrer-policy: strict-origin-when-cross-origin' <<< "$headers" || return 1
            [[ "$removed_status" == "410" ]] || return 1
            [[ "$runes_status" == "200" ]] || return 1
            grep -q "$target_sha" <<< "$version_res" || return 1
          }

          echo "Awaiting production convergence for commit $target_sha..."
          for attempt in {1..24}; do
            if verify; then
              echo "Production verification passed for $target_sha"
              exit 0
            fi
            sleep 5
          done

          echo "Production verification did not converge to the verified commit $target_sha."
          exit 1
