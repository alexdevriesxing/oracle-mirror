name = "oracle-mirror"
main = "dist/index.js"
compatibility_date = "2024-12-01"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "ORACLE_KV"
id = "b277f41b3df54315977eb7aa50c4e539"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "oracle_mirror_events"

[version_metadata]
binding = "CF_VERSION_METADATA"

# The temporary World Cup / Oracle of Olympus feature and its scheduled sync
# were removed in V2 Pass 2. No scheduled trigger remains.

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[routes]]
pattern = "oraclemirror.com"
custom_domain = true

[[routes]]
pattern = "www.oraclemirror.com"
custom_domain = true
