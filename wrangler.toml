name = "oracle-mirror"
main = "dist/index.js"
compatibility_date = "2024-12-01"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "ORACLE_KV"
id = "b277f41b3df54315977eb7aa50c4e539"

# Oracle of Olympus is now a post-tournament World Cup 2026 prediction archive.
# The previous two-hour fixture/results sync was retired after the tournament.

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[routes]]
pattern = "oraclemirror.com"
custom_domain = true

[[routes]]
pattern = "www.oraclemirror.com"
custom_domain = true
